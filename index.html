        <h1>TCF Canada Expression Écrite Simulator — Simulateur Gratuit d'Examen</h1>
        <p>Préparez-vous à l'épreuve d'expression écrite du TCF Canada (Tâches 1, 2 et 3) dans les conditions réelles avec le minuteur officiel de 60 minutes, sujets récents 2024-2026, décompte officiel des mots et évaluation IA instantanée.</p>
        <h2>Structure de l'Examen Officiel (60 minutes)</h2>
        <ul>
          <li><strong>Tâche 1 (Message / Courriel court) :</strong> 60 à 120 mots. Décrire, informer ou inviter.</li>
          <li><strong>Tâche 2 (Récit / Article) :</strong> 120 à 150 mots. Raconter une expérience personnelle ou un événement.</li>
          <li><strong>Tâche 3 (Avis argumenté / Essai) :</strong> 120 à 180 mots. Synthétiser deux opinions opposées et justifier sa prise de position.</li>
        </ul>
        <h2>Règles de Comptage Officiel des Mots</h2>
        <p>Chaque groupe de lettres séparé par un espace ou un signe de ponctuation équivaut à un mot. Les élisions avec apostrophe (c'est, j'ai, d'accord) comptent pour 2 mots distincts. Respectez scrupuleusement les seuils minimaux pour éviter les pénalités officielles.</p>
        <h2>Foire Aux Questions (FAQ TCF Canada)</h2>
        <h3>Combien de temps dure l'épreuve ?</h3>
        <p>L'épreuve dure exactement 60 minutes au total pour rédiger les trois tâches sans interruption.</p>
        <h3>Quel score pour obtenir le NCLC 7 / CLB 7 ?</h3>
        <p>Un score de 10 à 13 sur 20 correspond au niveau B2 (NCLC 7), essentiel pour le programme Entrée Express d'Immigration, Réfugiés et Citoyenneté Canada (IRCC).</p>
